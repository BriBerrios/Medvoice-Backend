        <script>
            const xmlhttp = new XMLHttpRequest();
            xmlhttp.onload = function() {
                myObj = JSON.parse(this.responseText);
                text = "<table border='1' class='table'>";
                text += "<thead class='thead-dark'>";
                text += "<th scope='col'>Index</th>";
                text += "<th scope='col'>Timestamp</th>";
                text += "<th scope='col'>Patient ID</th>";
                text += "<th scope='col'>Flow ID</th>";
                text += "</thead>";
                text += "<tbody>";
                for (x in myObj) {
                    text += "<tr><td scope='row'>" + myObj[x][0] + "</td>";
                    text += "<td scope='row'>" + myObj[x][3] + "</td>";
                    text += "<td scope='row'>" + myObj[x][2] + "</td>";
                    text += "<td scope='row'>" + myObj[x][1] + "</td>";
                    text += "</tr>";
                }
                text += "</tbody>"
                text += "</table>";
                document.getElementById("patienttable").innerHTML = text;
            }
            xmlhttp.open("GET", "http://54.226.91.1:22099/api/flowHistory");
            xmlhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            xmlhttp.send();
        </script>
